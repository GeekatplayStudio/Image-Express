name: Desktop smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"
  push:
    branches: [ "main" ]
    paths:
      - "electron/**"
      - "scripts/smoke-package.mjs"
      - "scripts/verify-package.mjs"
      - "scripts/smoke-mac-install.mjs"
      - "scripts/mac-installation.test.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-smoke.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "electron/**"
      - "scripts/smoke-package.mjs"
      - "scripts/verify-package.mjs"
      - "scripts/smoke-mac-install.mjs"
      - "scripts/mac-installation.test.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-smoke.yml"

permissions:
  contents: read

jobs:
  package-and-launch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: npm run desktop:pack
            smoke: npm run desktop:smoke-package
          - os: macos-15
            build: npm run desktop:dist:mac -- --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
            smoke: npm run desktop:smoke-mac-install
          - os: macos-15-intel
            build: npm run desktop:dist:mac -- --x64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
            smoke: npm run desktop:smoke-mac-install
          - os: ubuntu-latest
            build: npm run desktop:pack
            smoke: xvfb-run -a npm run desktop:smoke-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:packaging
      # Internal unsigned/ad-hoc packages only. Release enforces signing and notarization.
      - run: ${{ matrix.build }}
      - run: npm run desktop:verify-package
      - name: Launch packaged application
        run: ${{ matrix.smoke }}
      - name: Retain internal Mac test installers
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: internal-unsigned-mac-${{ runner.arch }}
          path: dist/*.dmg
          retention-days: 7

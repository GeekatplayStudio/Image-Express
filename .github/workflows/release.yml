name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run verify

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run desktop:dist:win -- --publish never
            smoke: npm run desktop:smoke-package
            artifact: windows
          - os: macos-latest
            command: npm run desktop:dist:mac -- --publish never
            smoke: npm run desktop:smoke-package
            artifact: macos
          - os: ubuntu-latest
            command: npm run desktop:dist:linux -- --publish never
            smoke: xvfb-run -a npm run desktop:smoke-package
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Configure code signing env
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WINDOWS_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          add_if_set() {
            if [ -n "${2:-}" ]; then
              echo "$1=$2" >> "$GITHUB_ENV"
            fi
          }
          # Keep each certificate on its own platform. electron-builder resolves
          # WIN_CSC_LINK but falls back to CSC_LINK when it is unset, so exporting
          # the macOS cert on the Windows runner makes it try to sign .exe files
          # with a Developer ID certificate.
          case "$RUNNER_OS" in
            macOS)
              add_if_set CSC_LINK "$MAC_CSC_LINK"
              add_if_set CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"
              add_if_set APPLE_API_KEY_ID "$APPLE_API_KEY_ID_SECRET"
              add_if_set APPLE_API_ISSUER "$APPLE_API_ISSUER_SECRET"
              # notarytool is invoked as `--key <path>`, so the App Store Connect
              # key has to exist as a file. Passing the .p8 contents through
              # APPLE_API_KEY directly makes notarization fail on a missing path.
              if [ -n "${APPLE_API_KEY_CONTENTS:-}" ]; then
                key_file="$RUNNER_TEMP/apple-api-key.p8"
                printf '%s\n' "$APPLE_API_KEY_CONTENTS" > "$key_file"
                chmod 600 "$key_file"
                echo "APPLE_API_KEY=$key_file" >> "$GITHUB_ENV"
              fi
              ;;
            Windows)
              add_if_set WIN_CSC_LINK "$WINDOWS_CSC_LINK"
              add_if_set WIN_CSC_KEY_PASSWORD "$WINDOWS_CSC_KEY_PASSWORD"
              ;;
          esac
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
      - run: npm ci
      - run: ${{ matrix.command }}
      - run: npm run desktop:verify-package
      - name: Launch packaged application
        run: ${{ matrix.smoke }}
      - uses: actions/upload-artifact@v4
        with:
          name: image-express-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.yaml
            dist/*.blockmap
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > release-artifacts/sbom.cdx.json
      - name: Generate checksums
        run: |
          cd release-artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-artifacts/* --draft --generate-notes --verify-tag

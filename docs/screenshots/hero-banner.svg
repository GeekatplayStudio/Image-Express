<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="150" cy="80" r="220" fill="url(#glow1)"/>
  <circle cx="1080" cy="340" r="240" fill="url(#glow2)"/>
  <g fill="#334155" opacity="0.5">
    <circle cx="80" cy="340" r="2"/><circle cx="200" cy="60" r="1.6"/><circle cx="960" cy="50" r="2"/>
    <circle cx="1100" cy="120" r="1.6"/><circle cx="640" cy="30" r="1.6"/><circle cx="420" cy="360" r="2"/>
  </g>
  <!-- brand mark -->
  <g transform="translate(90,150)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#brand)"/>
    <text x="32" y="43" font-family="Verdana, Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff">iEX</text>
  </g>
  <text x="180" y="185" font-family="Arial, sans-serif" font-size="58" font-weight="900" fill="#ffffff">Image Express</text>
  <text x="180" y="228" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8">The open-source AI design studio that unifies 2D, 3D, and generative AI —</text>
  <text x="180" y="256" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8">then lets you skin the whole thing in a talking pixel dragon if you feel like it.</text>

  <!-- feature chips -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(180,290)"><rect width="150" height="34" rx="17" fill="#0891b2" opacity="0.18" stroke="#0891b2"/><text x="75" y="22" text-anchor="middle" fill="#67e8f9">2D + 3D Canvas</text></g>
    <g transform="translate(342,290)"><rect width="168" height="34" rx="17" fill="#2563eb" opacity="0.18" stroke="#2563eb"/><text x="84" y="22" text-anchor="middle" fill="#93c5fd">Any AI, Local or Cloud</text></g>
    <g transform="translate(522,290)"><rect width="150" height="34" rx="17" fill="#7c3aed" opacity="0.18" stroke="#7c3aed"/><text x="75" y="22" text-anchor="middle" fill="#c4b5fd">Animated Themes</text></g>
    <g transform="translate(684,290)"><rect width="188" height="34" rx="17" fill="#db2777" opacity="0.18" stroke="#db2777"/><text x="94" y="22" text-anchor="middle" fill="#f9a8d4">3D Stack Workspace</text></g>
    <g transform="translate(884,290)"><rect width="150" height="34" rx="17" fill="#16a34a" opacity="0.18" stroke="#16a34a"/><text x="75" y="22" text-anchor="middle" fill="#86efac">11 Languages</text></g>
  </g>

  <!-- tiny dragon easter egg -->
  <g transform="translate(1010,60)" opacity="0.9">
    <rect x="0" y="8" width="6" height="3" fill="#287633"/>
    <rect x="5" y="6" width="18" height="6" fill="#3fae4a"/>
    <rect x="10" y="0" width="8" height="5" fill="#7ed957"/>
    <rect x="22" y="4" width="10" height="6" fill="#3fae4a"/>
    <rect x="32" y="4" width="4" height="2" fill="#ffa63f"/>
    <rect x="36" y="5" width="3" height="2" fill="#ff4628"/>
  </g>
</svg>

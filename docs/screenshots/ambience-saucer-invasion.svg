<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#140b26"/>
  <rect y="120" width="320" height="40" fill="#2a1a4a"/>
  <rect y="160" width="320" height="40" fill="#3f3354"/>
  <g fill="#6b5c8f"><rect x="80" y="24" width="2" height="2"/><rect x="180" y="40" width="2" height="2"/><rect x="270" y="20" width="2" height="2"/><rect x="140" y="60" width="2" height="2"/></g>
  <circle cx="52" cy="36" r="16" fill="#c77b4f"/>
  <rect x="26" y="38" width="52" height="4" fill="#e0a86e" transform="rotate(-12 52 40)"/>
  <!-- saucer -->
  <g transform="translate(180,34)">
    <rect x="10" y="0" width="12" height="5" fill="#7de8ff"/>
    <rect x="0" y="5" width="32" height="7" fill="#9aa7b8"/>
    <rect x="3" y="12" width="26" height="3" fill="#5e6b7c"/>
    <g fill="#ffd66b"><rect x="5" y="8" width="3" height="2"/><rect x="14" y="8" width="3" height="2"/><rect x="23" y="8" width="3" height="2"/></g>
  </g>
  <!-- alien shooting -->
  <g transform="translate(80,150)">
    <rect x="4" y="0" width="12" height="10" fill="#5ce65c"/>
    <rect x="6" y="2" width="4" height="4" fill="#181425"/>
    <rect x="6" y="10" width="8" height="8" fill="#5ce65c"/>
    <rect x="14" y="12" width="8" height="3" fill="#5e6b7c"/>
    <rect x="24" y="12" width="6" height="2" fill="#66ff66"/>
    <rect x="36" y="11" width="6" height="2" fill="#66ff66"/>
  </g>
  <!-- giant fly -->
  <g transform="translate(150,104)">
    <rect x="4" y="6" width="16" height="8" fill="#2c2137"/>
    <rect x="18" y="6" width="6" height="6" fill="#2c2137"/>
    <rect x="22" y="8" width="3" height="3" fill="#ff4a4a"/>
    <rect x="6" y="0" width="10" height="6" fill="#bcd0e8"/>
  </g>
  <!-- second alien running -->
  <g transform="translate(240,152)">
    <rect x="2" y="0" width="10" height="9" fill="#5ce65c"/>
    <rect x="4" y="2" width="3" height="3" fill="#181425"/>
    <rect x="4" y="9" width="6" height="7" fill="#5ce65c"/>
  </g>
</svg>
